<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative MSG email file viewer</title>
  <desc id="desc">A browser-based email review layout showing parsed sender, subject, message content, and file metadata for a synthetic MSG file.</desc>
  <rect width="1000" height="560" rx="25" fill="#eef2f7"/>
  <rect width="1000" height="50" rx="25" fill="#fff"/>
  <circle cx="25" cy="25" r="6" fill="#f27872"/><circle cx="44" cy="25" r="6" fill="#efbf62"/><circle cx="63" cy="25" r="6" fill="#60be8c"/>
  <rect x="330" y="14" width="340" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="29" text-anchor="middle" font-family="Arial" font-size="10" fill="#8994a4">MSG VIEWER · EMAIL FILE REVIEW · ILLUSTRATIVE</text>
  <rect x="29" y="72" width="942" height="440" rx="14" fill="#fff" stroke="#dfe5ec"/>
  <rect x="29" y="72" width="198" height="440" rx="14" fill="#182744"/>
  <text x="53" y="112" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Email files</text>
  <rect x="46" y="139" width="164" height="41" rx="8" fill="#30466c"/><rect x="60" y="151" width="17" height="18" rx="3" fill="#65cce7"/><text x="69" y="164" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#15314a">M</text><text x="89" y="165" font-family="Arial" font-size="10" fill="#fff">Open MSG file</text>
  <g font-family="Arial" font-size="11" fill="#b1bfd3"><text x="61" y="218">Message content</text><text x="61" y="258">Header details</text><text x="61" y="298">Attachments</text></g>
  <text x="255" y="111" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#73839a">FILE VIEWER / MESSAGE DETAILS</text>
  <text x="255" y="151" font-family="Arial" font-size="24" font-weight="700" fill="#1e2a3e">Email message</text>
  <rect x="255" y="171" width="682" height="51" rx="8" fill="#f7f9fc" stroke="#e5eaf0"/><path d="M277 187h17v13h-17z" fill="none" stroke="#6380a2" stroke-width="1.5"/><path d="m278 188 8 7 8-7" fill="none" stroke="#6380a2" stroke-width="1.5"/>
  <text x="309" y="192" font-family="Arial" font-size="11" font-weight="700" fill="#334258">sample-message.msg</text><text x="309" y="208" font-family="Arial" font-size="9" fill="#8995a4">MSG file · opened for review</text>
  <rect x="255" y="240" width="682" height="224" rx="9" fill="#fff" stroke="#e4e9ef"/>
  <text x="280" y="274" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.1" fill="#8792a0">SUBJECT</text><text x="280" y="301" font-family="Arial" font-size="16" font-weight="700" fill="#26354b">Project update and next steps</text>
  <path d="M280 318h632" stroke="#e9edf2"/>
  <g font-family="Arial"><text x="280" y="345" font-size="9" font-weight="700" fill="#8592a2">FROM</text><text x="365" y="345" font-size="10" fill="#3b4c61">Sample sender</text><text x="280" y="371" font-size="9" font-weight="700" fill="#8592a2">TO</text><text x="365" y="371" font-size="10" fill="#3b4c61">Sample recipient</text><text x="280" y="397" font-size="9" font-weight="700" fill="#8592a2">DATE</text><text x="365" y="397" font-size="10" fill="#3b4c61">Message metadata</text></g>
  <path d="M280 414h632" stroke="#e9edf2"/>
  <g stroke="#dce2e9" stroke-width="6" stroke-linecap="round"><path d="M280 436h536M280 452h414"/></g>
  <text x="500" y="540" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="1.3" fill="#7e8da0">ILLUSTRATIVE · SYNTHETIC EMAIL CONTENT · NOT A REAL MESSAGE</text>
</svg>
