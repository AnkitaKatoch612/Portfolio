<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative EML content and attachment viewer</title>
  <desc id="desc">A browser-based EML reading layout with readable message content and a separate attachment context panel using synthetic data.</desc>
  <rect width="1000" height="560" rx="25" fill="#f1f3f8"/>
  <rect width="1000" height="50" rx="25" fill="#fff"/>
  <circle cx="25" cy="25" r="6" fill="#f27872"/><circle cx="44" cy="25" r="6" fill="#efbf62"/><circle cx="63" cy="25" r="6" fill="#60be8c"/>
  <rect x="330" y="14" width="340" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="29" text-anchor="middle" font-family="Arial" font-size="10" fill="#8994a4">EML VIEWER · MESSAGE &amp; ATTACHMENT CONTEXT · ILLUSTRATIVE</text>
  <rect x="29" y="72" width="942" height="440" rx="14" fill="#fff" stroke="#dfe5ec"/>
  <rect x="29" y="72" width="198" height="440" rx="14" fill="#1c2942"/>
  <text x="53" y="112" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Message review</text>
  <rect x="46" y="139" width="164" height="41" rx="8" fill="#34476a"/><rect x="60" y="151" width="17" height="18" rx="3" fill="#91a9f6"/><text x="69" y="164" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#1b3159">E</text><text x="89" y="165" font-family="Arial" font-size="10" fill="#fff">Open EML file</text>
  <g font-family="Arial" font-size="11" fill="#b4bfd3"><text x="61" y="218">Readable content</text><text x="61" y="258">Message metadata</text><text x="61" y="298">Attachment context</text></g>
  <text x="255" y="111" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#76859e">EMAIL / CONTENT VIEW</text>
  <text x="255" y="151" font-family="Arial" font-size="24" font-weight="700" fill="#202d43">Readable message</text>
  <rect x="255" y="171" width="682" height="54" rx="8" fill="#f7f8fc" stroke="#e4e7ef"/>
  <rect x="274" y="184" width="29" height="29" rx="7" fill="#eceeff"/><path d="M282 192h13m-13 5h13m-13 5h9" stroke="#7385d1" stroke-width="1.5" stroke-linecap="round"/>
  <text x="316" y="194" font-family="Arial" font-size="11" font-weight="700" fill="#334258">sample-message.eml</text><text x="316" y="211" font-family="Arial" font-size="9" fill="#8995a4">Parsed email content · browser view</text>
  <rect x="255" y="243" width="430" height="223" rx="9" fill="#fff" stroke="#e4e9ef"/>
  <text x="279" y="278" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1" fill="#8491a1">MESSAGE</text>
  <text x="279" y="312" font-family="Arial" font-size="16" font-weight="700" fill="#27364c">A note for the project team</text>
  <g stroke="#dbe2e9" stroke-width="7" stroke-linecap="round"><path d="M279 341h377M279 366h363M279 391h380M279 416h348"/></g>
  <text x="279" y="449" font-family="Arial" font-size="9" fill="#8491a1">Readable email body · synthetic sample</text>
  <rect x="703" y="243" width="234" height="223" rx="9" fill="#f7f8fc" stroke="#e4e7ef"/>
  <text x="722" y="277" font-family="Arial" font-size="12" font-weight="700" fill="#29384d">Attachments</text><text x="722" y="296" font-family="Arial" font-size="9" fill="#8a96a4">Context from this message</text>
  <rect x="721" y="316" width="198" height="55" rx="8" fill="#fff" stroke="#e6e9ef"/><rect x="735" y="329" width="25" height="29" rx="4" fill="#eef1ff"/><path d="M741 337h12m-12 6h12m-12 6h8" stroke="#7686cf" stroke-width="1.2"/><text x="771" y="341" font-family="Arial" font-size="9" font-weight="700" fill="#3d4b60">project-notes.pdf</text><text x="771" y="356" font-family="Arial" font-size="8" fill="#8b96a3">Attachment</text>
  <rect x="721" y="383" width="198" height="55" rx="8" fill="#fff" stroke="#e6e9ef"/><rect x="735" y="396" width="25" height="29" rx="4" fill="#f1ecff"/><path d="M741 404h12m-12 6h12m-12 6h8" stroke="#9982d5" stroke-width="1.2"/><text x="771" y="408" font-family="Arial" font-size="9" font-weight="700" fill="#3d4b60">schedule.csv</text><text x="771" y="423" font-family="Arial" font-size="8" fill="#8b96a3">Attachment</text>
  <text x="500" y="540" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="1.3" fill="#7e8da0">ILLUSTRATIVE · SYNTHETIC EMAIL &amp; ATTACHMENTS · NOT A REAL MESSAGE</text>
</svg>
