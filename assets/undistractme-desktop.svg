<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">UndistractMe desktop design concept</title><desc id="d">A calm lavender focus-space dashboard concept with a focus intention and distraction reflection panel. No functional timer, blocker, or integrations are implied.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ecebff"/><stop offset="1" stop-color="#f7f4fb"/></linearGradient><linearGradient id="lav" x2="1" y2="1"><stop stop-color="#776ce0"/><stop offset="1" stop-color="#aaa0f3"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="17" stdDeviation="22" flood-color="#413a78" flood-opacity=".15"/></filter></defs><rect width="1200" height="760" rx="30" fill="url(#bg)"/><rect x="0" y="0" width="1200" height="48" rx="30" fill="#f2f1fb"/><path d="M0 48h1200" stroke="#e8e6f4"/><circle cx="28" cy="24" r="6" fill="#fa8583"/><circle cx="49" cy="24" r="6" fill="#f0c46d"/><circle cx="70" cy="24" r="6" fill="#66c995"/><rect x="415" y="12" width="370" height="24" rx="12" fill="#fff"/><text x="600" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8b879f">undistractme · design concept</text><rect x="72" y="83" width="1056" height="626" rx="19" fill="#fff" filter="url(#sh)"/><rect x="72" y="83" width="205" height="626" rx="19" fill="#faf9fe"/><path d="M277 83v626" stroke="#eeecf5"/><text x="105" y="132" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2d2b48">undistract<tspan fill="#8578dc">me</tspan></text><text x="105" y="194" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#aaa5bd">YOUR SPACE</text><g font-family="Arial,sans-serif" font-size="14"><rect x="94" y="211" width="161" height="40" rx="10" fill="#efedff"/><circle cx="115" cy="231" r="5" fill="#8277db"/><text x="130" y="235" fill="#514b8f">Today</text><circle cx="115" cy="282" r="5" fill="#c1bdd0"/><text x="130" y="286" fill="#858097">Intentions</text><circle cx="115" cy="333" r="5" fill="#c1bdd0"/><text x="130" y="337" fill="#858097">Reflections</text></g><text x="105" y="655" font-family="Arial,sans-serif" font-size="11" fill="#aaa5bd">WEBSITE CONCEPT</text><rect x="312" y="116" width="168" height="24" rx="12" fill="#f1effc"/><text x="396" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#7569c2">DESIGN IN PROGRESS</text><text x="312" y="192" font-family="Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="-1.4" fill="#282640">Choose what matters now.</text><text x="312" y="222" font-family="Arial,sans-serif" font-size="14" fill="#8d899f">A gentle space to bring your attention back to what you chose.</text><rect x="312" y="257" width="489" height="270" rx="18" fill="#faf9ff" stroke="#ece9f8"/><text x="344" y="298" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#a19bb7">A MOMENT FOR YOU</text><circle cx="555" cy="400" r="75" fill="none" stroke="#e9e5fa" stroke-width="10"/><path d="M555 325a75 75 0 0 1 70 48" fill="none" stroke="url(#lav)" stroke-width="10" stroke-linecap="round"/><circle cx="625" cy="373" r="5" fill="#8074df"/><circle cx="555" cy="400" r="53" fill="#fff"/><path d="M539 402c10-16 22-16 32 0" fill="none" stroke="#9288dc" stroke-width="3" stroke-linecap="round"/><circle cx="542" cy="387" r="2.5" fill="#474263"/><circle cx="568" cy="387" r="2.5" fill="#474263"/><text x="555" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#817b99">Pause. Notice. Choose.</text><rect x="457" y="487" width="196" height="22" rx="11" fill="#eeeaff"/><text x="555" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#6f64b6">Illustrative focus prompt</text><rect x="824" y="257" width="269" height="270" rx="18" fill="#fff" stroke="#ece9f8"/><text x="851" y="298" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#a19bb7">NOTICE YOUR DISTRACTIONS</text><text x="851" y="329" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#34314f">What pulled you away?</text><text x="851" y="353" font-family="Arial,sans-serif" font-size="11" fill="#9a96aa">A reflection concept — not app tracking</text><rect x="851" y="376" width="215" height="42" rx="9" fill="#f8f7fc"/><circle cx="871" cy="397" r="6" fill="#c2bbef"/><rect x="888" y="393" width="100" height="6" rx="3" fill="#d8d5e4"/><rect x="851" y="428" width="215" height="42" rx="9" fill="#f8f7fc"/><circle cx="871" cy="449" r="6" fill="#d8c7e7"/><rect x="888" y="445" width="116" height="6" rx="3" fill="#d8d5e4"/><rect x="312" y="548" width="781" height="117" rx="18" fill="#f3f1fc"/><text x="342" y="584" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8177c0">A SMALL NEXT STEP</text><text x="342" y="617" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#373452">What would you like to give your attention to?</text><rect x="342" y="633" width="470" height="1" fill="#dedaf0"/><text x="342" y="653" font-family="Arial,sans-serif" font-size="11" fill="#a39eb3">Intended experience concept · interactions are not functional</text><rect x="993" y="584" width="68" height="35" rx="17" fill="url(#lav)"/><path d="M1021 596v11m-5-5h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
