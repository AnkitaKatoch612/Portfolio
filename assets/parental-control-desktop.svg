<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Parental Control design concept</title>
  <desc id="desc">Illustrative desktop design showing parent and child profiles, a qualitative screen-time summary, a weekly schedule, app-category limits, and privacy and consent principles. Proposed concept only; controls are not functional.</desc>
