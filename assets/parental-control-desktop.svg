  <rect x="70" y="235" width="1060" height="92" rx="15" fill="url(#hero)"/><circle cx="120" cy="281" r="27" fill="#fff" fill-opacity=".18"/><text x="120" y="287" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">P</text><text x="164" y="272" font-family="Arial" font-size="12" fill="#e6e3ff">PARENT PROFILE</text><text x="164" y="297" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Family guide</text><path d="M575 253v56" stroke="#fff" stroke-opacity=".28"/><circle cx="626" cy="281" r="27" fill="#fff" fill-opacity=".18"/><text x="626" y="287" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">C</text><text x="670" y="272" font-family="Arial" font-size="12" fill="#e6e3ff">CHILD PROFILE</text><text x="670" y="297" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Child profile · sample</text><text x="1000" y="285" font-family="Arial" font-size="12" fill="#fff">Visibility explained  ✓</text>
