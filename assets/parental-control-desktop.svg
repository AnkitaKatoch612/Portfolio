  <rect width="1200" height="760" rx="26" fill="#e9e7f4"/><rect x="26" y="26" width="1148" height="708" rx="20" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="62" rx="20" fill="#fff"/><path d="M26 68h1148v20H26z" fill="#fff"/><circle cx="65" cy="57" r="15" fill="#5148a6"/><text x="65" y="62" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">P</text><text x="91" y="62" font-family="Arial" font-size="17" font-weight="700" fill="#25243b">Parental Control</text><text x="970" y="61" font-family="Arial" font-size="12" fill="#6f7080">DESIGN CONCEPT</text>
