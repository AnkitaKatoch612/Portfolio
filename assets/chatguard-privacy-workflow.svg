<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative ChatGuard privacy controls</title>
  <desc id="desc">A fictional browser chat view beside privacy controls for masking message details and reducing on-screen visibility.</desc>
  <rect width="1000" height="560" rx="25" fill="#eef3f7"/>
  <rect width="1000" height="50" rx="25" fill="#fff"/>
  <circle cx="25" cy="25" r="6" fill="#f27872"/><circle cx="44" cy="25" r="6" fill="#efbf62"/><circle cx="63" cy="25" r="6" fill="#60be8c"/>
  <rect x="330" y="14" width="340" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="29" text-anchor="middle" font-family="Arial" font-size="10" fill="#8994a4">CHATGUARD · PRIVACY CONTROLS · ILLUSTRATIVE</text>
  <rect x="34" y="72" width="612" height="439" rx="13" fill="#fff" stroke="#e1e6eb"/>
  <rect x="34" y="72" width="612" height="58" rx="13" fill="#f8fafb"/>
  <circle cx="70" cy="101" r="17" fill="#dce9e5"/><circle cx="70" cy="96" r="6" fill="#72958a"/><path d="M58 113c2-9 22-9 24 0" fill="#72958a"/>
  <text x="101" y="98" font-family="Arial" font-size="13" font-weight="700" fill="#243247">Conversation</text><text x="101" y="116" font-family="Arial" font-size="10" fill="#8b96a3">Private view enabled</text>
  <rect x="64" y="158" width="286" height="57" rx="11" fill="#f2f5f7"/><text x="83" y="181" font-family="Arial" font-size="11" fill="#526174">Can you share the project notes?</text><text x="83" y="199" font-family="Arial" font-size="9" fill="#8b96a3">10:42</text>
  <rect x="263" y="232" width="343" height="66" rx="11" fill="#e8f1ff"/><text x="282" y="256" font-family="Arial" font-size="11" fill="#526174">Sure, I’ll send them after the review.</text><text x="282" y="277" font-family="Arial" font-size="9" fill="#8b96a3">10:44</text>
  <rect x="64" y="316" width="310" height="58" rx="11" fill="#f2f5f7"/><text x="83" y="339" font-family="Arial" font-size="11" fill="#526174">Please include the timeline too.</text><text x="83" y="358" font-family="Arial" font-size="9" fill="#8b96a3">10:45</text>
  <rect x="263" y="392" width="343" height="65" rx="11" fill="#e8f1ff"/><text x="282" y="417" font-family="Arial" font-size="11" fill="#526174">Got it. I’ll add it to the summary.</text><text x="282" y="438" font-family="Arial" font-size="9" fill="#8b96a3">10:46</text>
  <rect x="670" y="72" width="296" height="439" rx="13" fill="#18263a"/>
  <rect x="695" y="95" width="45" height="45" rx="13" fill="#183d52" stroke="#36c7e0"/><path d="M718 105l11 4v9c0 8-5 13-11 16-7-3-11-8-11-16v-9z" fill="none" stroke="#65d8e6" stroke-width="2"/><path d="M713 118l4 4 7-8" fill="none" stroke="#65d8e6" stroke-width="2" stroke-linecap="round"/>
  <text x="754" y="112" font-family="Arial" font-size="15" font-weight="700" fill="#f5f7fb">Privacy controls</text><text x="754" y="131" font-family="Arial" font-size="10" fill="#9bacc0">On-page extension panel</text>
  <g font-family="Arial"><rect x="694" y="164" width="248" height="78" rx="10" fill="#22334a"/><text x="711" y="190" font-size="12" font-weight="700" fill="#f1f5fa">Mask sensitive text</text><text x="711" y="210" font-size="9" fill="#a5b3c4">Reduce message visibility</text><rect x="884" y="181" width="41" height="23" rx="12" fill="#35c6df"/><circle cx="912" cy="192" r="8" fill="#fff"/>
  <rect x="694" y="256" width="248" height="78" rx="10" fill="#22334a"/><text x="711" y="282" font-size="12" font-weight="700" fill="#f1f5fa">Safer screen sharing</text><text x="711" y="302" font-size="9" fill="#a5b3c4">Choose what stays visible</text><rect x="884" y="273" width="41" height="23" rx="12" fill="#35c6df"/><circle cx="912" cy="284" r="8" fill="#fff"/>
  <rect x="694" y="348" width="248" height="78" rx="10" fill="#22334a"/><text x="711" y="374" font-size="12" font-weight="700" fill="#f1f5fa">Quick controls</text><text x="711" y="394" font-size="9" fill="#a5b3c4">Adjust directly in the page</text><path d="M712 408h204" stroke="#3a4e66" stroke-width="1"/>
  </g>
  <text x="500" y="540" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="1.3" fill="#75859a">ILLUSTRATIVE UI · NO REAL CONVERSATIONS OR PERSONAL DATA</text>
</svg>
