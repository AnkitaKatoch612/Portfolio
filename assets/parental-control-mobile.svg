<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 820" role="img" aria-labelledby="title desc">
  <title id="title">Parental Control mobile design concept</title>
  <desc id="desc">Illustrative mobile family view with parent and child profiles, a qualitative screen-time summary, schedule proposal, app-category boundaries, and privacy and consent notes. Proposed concept only; controls are not functional.</desc>
  <defs><linearGradient id="hero" x2="1"><stop stop-color="#5148a6"/><stop offset="1" stop-color="#8176c9"/></linearGradient></defs>
  <rect width="390" height="820" rx="40" fill="#29263e"/><rect x="10" y="10" width="370" height="800" rx="32" fill="#f7f6fc"/><rect x="10" y="10" width="370" height="40" rx="30" fill="#fff"/><text x="31" y="37" font-family="Arial" font-size="14" font-weight="700" fill="#29283f">Parental Control</text><text x="281" y="36" font-family="Arial" font-size="9" font-weight="700" fill="#756da9">CONCEPT</text>
  <text x="29" y="82" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.5" fill="#756da9">PARENT DASHBOARD</text><text x="29" y="111" font-family="Arial" font-size="22" font-weight="700" fill="#29283f">Screen-time</text><text x="29" y="137" font-family="Arial" font-size="22" font-weight="700" fill="#29283f">with clear limits.</text>
  <rect x="26" y="158" width="338" height="77" rx="14" fill="url(#hero)"/><circle cx="53" cy="191" r="17" fill="#fff" fill-opacity=".2"/><text x="53" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">P</text><text x="79" y="185" font-family="Arial" font-size="8" fill="#e5e2ff">PARENT PROFILE</text><text x="79" y="202" font-family="Arial" font-size="11" font-weight="700" fill="#fff">Family guide</text><circle cx="222" cy="191" r="17" fill="#fff" fill-opacity=".2"/><text x="222" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">C</text><text x="246" y="185" font-family="Arial" font-size="8" fill="#e5e2ff">CHILD PROFILE</text><text x="246" y="202" font-family="Arial" font-size="10" font-weight="700" fill="#fff">Sample profile</text>
  <rect x="26" y="250" width="338" height="154" rx="14" fill="#fff"/><text x="43" y="279" font-family="Arial" font-size="13" font-weight="700" fill="#29283f">Screen-time summary</text><text x="43" y="298" font-family="Arial" font-size="9" fill="#858497">Illustrative · no device data</text><circle cx="79" cy="348" r="29" fill="none" stroke="#ebe9f4" stroke-width="8"/><path d="M79 319a29 29 0 0 1 25 44" fill="none" stroke="#8176c9" stroke-width="8" stroke-linecap="round"/><text x="79" y="352" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#5148a6">SAMPLE</text><text x="127" y="343" font-family="Arial" font-size="11" font-weight="700" fill="#58576d">Usage overview</text><text x="127" y="362" font-family="Arial" font-size="9" fill="#858497">A starting point for a kind</text><text x="127" y="376" font-family="Arial" font-size="9" fill="#858497">family conversation.</text>
  <rect x="26" y="418" width="338" height="136" rx="14" fill="#fff"/><text x="43" y="447" font-family="Arial" font-size="13" font-weight="700" fill="#29283f">Family schedule</text><text x="43" y="465" font-family="Arial" font-size="9" fill="#858497">Proposed routine · sample</text><text x="43" y="495" font-family="Arial" font-size="9" fill="#6f7080">AFTER SCHOOL</text><rect x="143" y="484" width="196" height="17" rx="8" fill="#f0eef8"/><rect x="168" y="484" width="83" height="17" rx="8" fill="#d9d4f1"/><text x="43" y="528" font-family="Arial" font-size="9" fill="#6f7080">WIND-DOWN</text><rect x="143" y="517" width="196" height="17" rx="8" fill="#f0eef8"/><rect x="230" y="517" width="73" height="17" rx="8" fill="#e4e0f6"/>
  <rect x="26" y="568" width="338" height="115" rx="14" fill="#fff"/><text x="43" y="597" font-family="Arial" font-size="13" font-weight="700" fill="#29283f">App-category limits</text><text x="43" y="615" font-family="Arial" font-size="9" fill="#858497">Proposed · not enforced</text><g font-family="Arial" font-size="10" fill="#55556a"><text x="44" y="647">Games</text><text x="151" y="647">Social</text><text x="258" y="647">Video</text></g><g fill="#9489d4"><rect x="44" y="657" width="72" height="6" rx="3"/><rect x="151" y="657" width="57" height="6" rx="3"/><rect x="258" y="657" width="78" height="6" rx="3"/></g>
  <rect x="26" y="697" width="338" height="88" rx="14" fill="#eeecf8"/><text x="43" y="724" font-family="Arial" font-size="10" font-weight="700" fill="#5148a6">PARENTAL CONTROL — DESIGN CONCEPT</text><text x="43" y="744" font-family="Arial" font-size="9" fill="#66647b">Privacy · age-aware choices · clear visibility</text><text x="43" y="761" font-family="Arial" font-size="9" fill="#66647b">Consent · secure access · shared understanding</text>
</svg>
