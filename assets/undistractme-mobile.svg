<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 760" role="img" aria-labelledby="t d"><title id="t">UndistractMe mobile app design concept</title><desc id="d">A concept-only mobile screen with an intention prompt and distraction reflection card. It is not a functional app or app-blocking integration.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0efff"/><stop offset="1" stop-color="#fbf8fd"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#776bdd"/><stop offset="1" stop-color="#aaa0ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#514c83" flood-opacity=".2"/></filter></defs><rect width="430" height="760" rx="36" fill="url(#bg)"/><rect x="110" y="13" width="210" height="25" rx="13" fill="#28263c"/><text x="36" y="74" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2d2a49">undistract<tspan fill="#8175d8">me</tspan></text><rect x="258" y="55" width="135" height="25" rx="12" fill="#e6e3fb"/><text x="325" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#675bb6">APP DESIGN CONCEPT</text><text x="36" y="139" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.7" fill="#9892b0">A LITTLE SPACE TO RESET</text><text x="36" y="178" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#302d4d">Where would you</text><text x="36" y="213" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#302d4d">like your attention?</text><rect x="28" y="245" width="374" height="252" rx="24" fill="#fff" filter="url(#s)"/><circle cx="215" cy="358" r="76" fill="#faf9ff" stroke="#e8e4f8" stroke-width="2"/><circle cx="215" cy="358" r="59" fill="none" stroke="#dfdaf6" stroke-width="7"/><path d="M215 299a59 59 0 0 1 50 28" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><circle cx="265" cy="327" r="4.5" fill="#8275dd"/><path d="M198 360c10-14 24-14 34 0" fill="none" stroke="#8a80d1" stroke-width="3" stroke-linecap="round"/><circle cx="201" cy="346" r="2.5" fill="#48445e"/><circle cx="229" cy="346" r="2.5" fill="#48445e"/><path d="M197 377q18 12 36 0" fill="none" stroke="#b4acd9" stroke-width="2.5" stroke-linecap="round"/><text x="215" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5a5676">Pause · Notice · Choose</text><text x="215" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa5bb">A friendly visual direction</text><text x="36" y="542" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#383550">Notice what pulls you away</text><text x="36" y="565" font-family="Arial,sans-serif" font-size="11" fill="#918ca4">A reflection idea — no tracking implied</text><rect x="28" y="585" width="374" height="62" rx="16" fill="#fff"/><circle cx="57" cy="616" r="12" fill="#efedfc"/><path d="M57 609v8l5 3" fill="none" stroke="#887bd2" stroke-width="1.7" stroke-linecap="round"/><rect x="80" y="609" width="153" height="6" rx="3" fill="#d7d4e3"/><rect x="80" y="622" width="104" height="5" rx="2.5" fill="#eceaf2"/><path d="m363 613 5 5-5 5" fill="none" stroke="#9288d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#7d73bd">DESIGN IN PROGRESS</text><text x="215" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa5b7">Concept preview · not a working app</text></svg>
